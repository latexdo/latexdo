name: hosted-editor-candidate

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "electron/preload.cts"
      - "build/icon.svg"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/deploy-editor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-editor-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: validate hosted frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_LATEXDO_RUNTIME: cloud
      VITE_LATEXDO_API_BASE_URL: https://editor.latexdo.org

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static checks
        run: npm run typecheck

      - name: Run lint
        run: npm run lint -- --quiet

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build canonical hosted frontend
        run: npx vite build

      - name: Upload immutable frontend candidate
        uses: actions/upload-artifact@v7
        with:
          name: hosted-editor-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
