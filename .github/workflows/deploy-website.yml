name: deploy-website

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "build/icon.svg"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy / latexdo.org
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: latexdo-org-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build TypeScript website
        shell: bash
        run: |
          npm ci --prefix website
          npm run build --prefix website

      - name: Prepare static website
        shell: bash
        run: |
          mkdir -p website/assets
          cp build/icon.svg website/assets/icon.svg
          # Downloads and update feeds are owned by latexdo-release. Leaving them
          # out of publish_dir lets keep_files preserve every versioned release.
          rm -rf website/downloads website/updates
          rm -rf website/node_modules website/src website/.github
          rm -f website/package.json website/package-lock.json website/tsconfig.json website/.gitignore

      - name: Select deploy mode
        id: deploy_mode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LATEXDO_WEBSITE_TOKEN: ${{ secrets.LATEXDO_WEBSITE_TOKEN }}
        shell: bash
        run: |
          if [ -z "$LATEXDO_WEBSITE_TOKEN" ]; then
            echo "website_enabled=false" >> "$GITHUB_OUTPUT"
            website_message="latexdo.org repo update skipped: missing LATEXDO_WEBSITE_TOKEN with contents write and actions write access."
          else
            echo "website_enabled=true" >> "$GITHUB_OUTPUT"
            website_message="latexdo.org repo update enabled."
          fi

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "cloudflare_enabled=false" >> "$GITHUB_OUTPUT"
            cloudflare_message="Cloudflare deploy skipped: missing CLOUDFLARE_API_TOKEN."
          else
            echo "cloudflare_enabled=true" >> "$GITHUB_OUTPUT"
            cloudflare_message="Cloudflare deploy enabled."
          fi

          {
            echo "### Website deploy mode"
            echo
            echo "- ${website_message}"
            echo "- ${cloudflare_message}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout latexdo.org
        if: ${{ steps.deploy_mode.outputs.website_enabled == 'true' }}
        uses: actions/checkout@v6
        with:
          repository: latexdo/latexdo.org
          ref: main
          path: latexdo-org-site
          token: ${{ secrets.LATEXDO_WEBSITE_TOKEN }}

      - name: Update latexdo.org website
        id: update_latexdo_org_website
        if: ${{ steps.deploy_mode.outputs.website_enabled == 'true' }}
        shell: bash
        run: |
          echo "updated=false" >> "$GITHUB_OUTPUT"
          echo "commit_sha=" >> "$GITHUB_OUTPUT"
          rsync -a website/ latexdo-org-site/

          git -C latexdo-org-site config user.name "github-actions[bot]"
          git -C latexdo-org-site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C latexdo-org-site add -A

          if git -C latexdo-org-site diff --cached --quiet; then
            echo "No latexdo.org website changes to commit."
          else
            git -C latexdo-org-site commit \
              -m "Deploy website from latexdo@${GITHUB_SHA}"
            git -C latexdo-org-site push origin HEAD:main
            commit_sha="$(git -C latexdo-org-site rev-parse HEAD)"
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "commit_sha=${commit_sha}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify latexdo.org Pages workflow started
        if: ${{ steps.update_latexdo_org_website.outputs.updated == 'true' }}
        shell: bash
        env:
          LATEXDO_ORG_COMMIT: ${{ steps.update_latexdo_org_website.outputs.commit_sha }}
        run: |
          api_url="https://api.github.com/repos/latexdo/latexdo.org/actions/workflows/pages.yml/runs?branch=main&per_page=20"

          for attempt in {1..12}; do
            run_url="$(
              curl -fsSL "$api_url" |
                node -e '
                  const fs = require("node:fs");
                  const commit = process.env.LATEXDO_ORG_COMMIT;
                  const payload = JSON.parse(fs.readFileSync(0, "utf8"));
                  const run = (payload.workflow_runs || []).find((item) => item.head_sha === commit);
                  process.stdout.write(run ? run.html_url : "");
                '
            )"

            if [ -n "$run_url" ]; then
              echo "latexdo.org Pages workflow started for ${LATEXDO_ORG_COMMIT}: ${run_url}"
              exit 0
            fi

            sleep 5
          done

          echo "::error::No latexdo.org Pages workflow run appeared for ${LATEXDO_ORG_COMMIT}."
          exit 1

      - name: Deploy website to Cloudflare
        if: ${{ steps.deploy_mode.outputs.website_enabled == 'true' && steps.deploy_mode.outputs.cloudflare_enabled == 'true' }}
        working-directory: latexdo-org-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest deploy
