name: deploy-website

on:
  workflow_run:
    workflows: ["latexdo-release"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website-downloads
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy / latexdo.org downloads index
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LATEXDO_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    concurrency:
      group: latexdo-org-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22.17.0

      - name: Validate publication credentials
        env:
          LATEXDO_WEBSITE_TOKEN: ${{ secrets.LATEXDO_WEBSITE_TOKEN }}
        shell: bash
        run: |
          if [ -z "$LATEXDO_WEBSITE_TOKEN" ]; then
            echo "::error::Missing LATEXDO_WEBSITE_TOKEN; cannot update latexdo.org downloads."
            exit 1
          fi

          {
            echo "### Downloads publication"
            echo
            echo "- latexdo.org downloads index update enabled."
            echo "- This workflow stages only downloads/releases.json."
            echo "- Release/update artifacts are published by latexdo-release."
            echo "- Cloudflare deployment is handled by the latexdo.org Git integration."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout latexdo.org
        uses: actions/checkout@v6
        with:
          repository: latexdo/latexdo.org
          ref: main
          path: latexdo-org-site
          token: ${{ secrets.LATEXDO_WEBSITE_TOKEN }}

      - name: Refresh latexdo.org downloads index
        id: update_latexdo_org_downloads_index
        shell: bash
        run: |
          echo "updated=false" >> "$GITHUB_OUTPUT"
          echo "commit_sha=" >> "$GITHUB_OUTPUT"

          LATEXDO_DOWNLOAD_BASE_URL=https://latexdo.org \
            node scripts/build-downloads-release-index.mjs latexdo-org-site/downloads --json-only

          git -C latexdo-org-site config user.name "github-actions[bot]"
          git -C latexdo-org-site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C latexdo-org-site add -- downloads/releases.json

          staged_paths="$(git -C latexdo-org-site diff --cached --name-only)"
          invalid_paths="$(printf '%s\n' "$staged_paths" | grep -Ev '^downloads/releases\.json$' || true)"
          if [ -n "$invalid_paths" ]; then
            echo "::error::Downloads index refresh must stage only downloads/releases.json."
            printf '%s\n' "$invalid_paths"
            exit 1
          fi

          if git -C latexdo-org-site diff --cached --quiet; then
            echo "No latexdo.org downloads index changes to commit."
          else
            git -C latexdo-org-site commit \
              -m "Refresh downloads index from latexdo@${LATEXDO_SOURCE_SHA}"
            git -C latexdo-org-site push origin HEAD:main
            commit_sha="$(git -C latexdo-org-site rev-parse HEAD)"
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "commit_sha=${commit_sha}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify latexdo.org update
        if: ${{ steps.update_latexdo_org_downloads_index.outputs.updated == 'true' }}
        shell: bash
        env:
          LATEXDO_ORG_COMMIT: ${{ steps.update_latexdo_org_downloads_index.outputs.commit_sha }}
        run: |
          remote_sha="$(git -C latexdo-org-site ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$remote_sha" != "$LATEXDO_ORG_COMMIT" ]; then
            echo "::error::latexdo.org main is ${remote_sha}, expected ${LATEXDO_ORG_COMMIT}."
            exit 1
          fi

          echo "latexdo.org downloads index updated at ${LATEXDO_ORG_COMMIT}."
          echo "Cloudflare Workers Builds can deploy the pushed downloads index commit."
