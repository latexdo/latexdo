name: deploy-website

on:
  workflow_run:
    workflows: ["latexdo-ci"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy / latexdo.org
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LATEXDO_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    concurrency:
      group: latexdo-org-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build TypeScript website
        shell: bash
        run: |
          npm ci --prefix website
          npm run build --prefix website

      - name: Prepare static website
        shell: bash
        run: |
          mkdir -p website/assets
          cp build/icon.svg website/assets/icon.svg
          # Downloads and update feeds are owned by latexdo-release. Leaving them
          # out of publish_dir lets keep_files preserve every versioned release.
          rm -rf website/downloads website/updates
          # The CLI and installer are released together with their signed feed.
          rm -rf website/bin
          rm -f website/install.sh
          rm -rf website/node_modules website/src website/.github
          rm -f website/package.json website/package-lock.json website/tsconfig.json website/.gitignore

      - name: Validate publication credentials
        env:
          LATEXDO_WEBSITE_TOKEN: ${{ secrets.LATEXDO_WEBSITE_TOKEN }}
        shell: bash
        run: |
          if [ -z "$LATEXDO_WEBSITE_TOKEN" ]; then
            echo "::error::Missing LATEXDO_WEBSITE_TOKEN; cannot update latexdo.org."
            exit 1
          fi

          {
            echo "### Website publication"
            echo
            echo "- latexdo.org repo update enabled."
            echo "- Cloudflare deployment is handled by the latexdo.org Git integration."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout latexdo.org
        uses: actions/checkout@v6
        with:
          repository: latexdo/latexdo.org
          ref: main
          path: latexdo-org-site
          token: ${{ secrets.LATEXDO_WEBSITE_TOKEN }}

      - name: Update latexdo.org website
        id: update_latexdo_org_website
        shell: bash
        run: |
          echo "updated=false" >> "$GITHUB_OUTPUT"
          echo "commit_sha=" >> "$GITHUB_OUTPUT"
          rsync -a website/ latexdo-org-site/

          git -C latexdo-org-site config user.name "github-actions[bot]"
          git -C latexdo-org-site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C latexdo-org-site add -A

          if git -C latexdo-org-site diff --cached --quiet; then
            echo "No latexdo.org website changes to commit."
          else
            git -C latexdo-org-site commit \
              -m "Deploy website from latexdo@${LATEXDO_SOURCE_SHA}"
            git -C latexdo-org-site push origin HEAD:main
            commit_sha="$(git -C latexdo-org-site rev-parse HEAD)"
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "commit_sha=${commit_sha}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify latexdo.org update
        if: ${{ steps.update_latexdo_org_website.outputs.updated == 'true' }}
        shell: bash
        env:
          LATEXDO_ORG_COMMIT: ${{ steps.update_latexdo_org_website.outputs.commit_sha }}
        run: |
          remote_sha="$(git -C latexdo-org-site ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$remote_sha" != "$LATEXDO_ORG_COMMIT" ]; then
            echo "::error::latexdo.org main is ${remote_sha}, expected ${LATEXDO_ORG_COMMIT}."
            exit 1
          fi

          echo "latexdo.org updated at ${LATEXDO_ORG_COMMIT}."
          echo "Cloudflare Workers Builds can deploy the pushed website repo."
