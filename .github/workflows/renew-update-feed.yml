name: renew-update-feed

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew:
    name: renew / signed latest feed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: latexdo-org-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22.17.0

      - name: Validate renewal credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LATEXDO_UPDATE_SIGNING_KEY: ${{ secrets.LATEXDO_UPDATE_SIGNING_KEY }}
          LATEXDO_WEBSITE_TOKEN: ${{ secrets.LATEXDO_WEBSITE_TOKEN }}
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN LATEXDO_UPDATE_SIGNING_KEY LATEXDO_WEBSITE_TOKEN; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Update-feed renewal cannot maintain its validity window. Missing: ${missing[*]}"
            exit 1
          fi

      - name: Checkout latexdo.org
        uses: actions/checkout@v6
        with:
          repository: latexdo/latexdo.org
          ref: main
          path: latexdo-org-site
          token: ${{ secrets.LATEXDO_WEBSITE_TOKEN }}

      - name: Renew signed latest feed
        env:
          LATEXDO_UPDATE_SIGNING_KEY: ${{ secrets.LATEXDO_UPDATE_SIGNING_KEY }}
        run: >
          node scripts/renew-update-feed.mjs
          latexdo-org-site/updates/latest.json
          latexdo-org-site/downloads
          build/update-public-key.pem

      - name: Verify renewed validity window
        env:
          LATEXDO_UPDATE_MIN_VALIDITY_DAYS: 14
        run: >
          node scripts/verify-update-feed.mjs
          latexdo-org-site/updates/latest.json
          build/update-public-key.pem

      - name: Commit only the renewed latest feed
        id: publish_feed
        shell: bash
        run: |
          git -C latexdo-org-site config user.name "github-actions[bot]"
          git -C latexdo-org-site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C latexdo-org-site add -- updates/latest.json

          staged_paths="$(git -C latexdo-org-site diff --cached --name-only)"
          if [ "$staged_paths" != "updates/latest.json" ]; then
            echo "::error::Renewal must stage only updates/latest.json; found: ${staged_paths:-<none>}"
            exit 1
          fi

          git -C latexdo-org-site commit \
            -m "Renew signed LatexDo update feed from latexdo@${GITHUB_SHA}"
          git -C latexdo-org-site push origin HEAD:main
          commit_sha="$(git -C latexdo-org-site rev-parse HEAD)"
          echo "commit_sha=${commit_sha}" >> "$GITHUB_OUTPUT"

      - name: Verify latexdo.org commit
        shell: bash
        env:
          LATEXDO_ORG_COMMIT: ${{ steps.publish_feed.outputs.commit_sha }}
        run: |
          remote_sha="$(git -C latexdo-org-site ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$remote_sha" != "$LATEXDO_ORG_COMMIT" ]; then
            echo "::error::latexdo.org main is ${remote_sha}, expected ${LATEXDO_ORG_COMMIT}."
            exit 1
          fi

      - name: Deploy renewed feed to Cloudflare
        working-directory: latexdo-org-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm ci
          npm run deploy

      - name: Verify live signed feed
        shell: bash
        env:
          LATEXDO_UPDATE_MIN_VALIDITY_DAYS: 14
        run: |
          live_feed="$RUNNER_TEMP/latexdo-latest.json"
          for attempt in $(seq 1 12); do
            url="https://latexdo.org/updates/latest.json?renewal=${GITHUB_RUN_ID}-${attempt}"
            if curl -fsSL --max-time 20 "$url" -o "$live_feed" && \
              cmp -s latexdo-org-site/updates/latest.json "$live_feed" && \
              node scripts/verify-update-feed.mjs "$live_feed" build/update-public-key.pem; then
              echo "Verified renewed update feed at ${url}."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Live update feed was not renewed with at least fourteen days of validity."
          exit 1

      - name: Alert on renewal failure
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "::error::Signed update-feed renewal failed; investigate before the remaining validity drops below fourteen days."
          {
            echo "### Update-feed renewal failed"
            echo
            echo "The signed latest feed could not be renewed and verified with at least fourteen days remaining."
          } >> "$GITHUB_STEP_SUMMARY"
